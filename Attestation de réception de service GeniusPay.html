<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attestation de réception de service</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#5c6670;--bd:#d9dee3;--ac:#2563EB;--acx:#fff;--ok:#0e7a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2226;--tx:#e8ebee;--mut:#9aa5af;--bd:#343c43;--ac:#6b9bff;--acx:#0b1220;--ok:#4cd08a}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2226;--tx:#e8ebee;--mut:#9aa5af;--bd:#343c43;--ac:#6b9bff;--acx:#0b1220;--ok:#4cd08a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:.2em 0 .1em}
.sub{color:var(--mut);margin:0 0 16px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:1rem;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.full{grid-column:1/-1}
.doc{background:#fff;color:#111;border:1px solid var(--bd);border-radius:8px;padding:20px;font-family:Georgia,"Times New Roman",serif;font-size:.95rem;line-height:1.55}
.doc h3{text-align:center;text-transform:uppercase;font-size:1.05rem;margin:0 0 14px}
.doc p{margin:.5em 0}
#pad{width:100%;height:170px;border:2px dashed var(--bd);border-radius:8px;background:#fff;touch-action:none;display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
button{font:inherit;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 16px;cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:.92rem}
.chk input{width:auto;margin-top:4px}
#msg{margin-top:10px;font-size:.92rem;color:var(--mut)}
#msg.ok{color:var(--ok)}
</style>
</head>
<body>
<main>
<h1>Attestation de réception de service</h1>
<p class="sub">GeniusPay · Confirmation de réception pour traçabilité</p>

<section class="card">
<h2>1. Détails de la transaction (GeniusPay)</h2>
<div class="grid">
<div><label for="ref">Référence de la transaction</label><input id="ref" value="MTX-S2YWYCWNQS"></div>
<div><label for="mar">Marchand</label><input id="mar" value="Bet ia Prono"></div>
<div><label for="tel">Numéro du client</label><input id="tel" value="+242 061 07 70 17"></div>
<div><label for="mail">E-mail du client</label><input id="mail" value="moukanajordan77@gmail.com"></div>
<div class="full"><label for="dt">Date et heure du paiement</label><input id="dt" value="16/09/2026 à 09:56"></div>
</div>
</section>

<section class="card">
<h2>2. Identité du client</h2>
<div class="grid">
<div><label for="nom">Nom</label><input id="nom" autocomplete="family-name" placeholder="Votre nom"></div>
<div><label for="pre">Prénom</label><input id="pre" autocomplete="given-name" placeholder="Votre prénom"></div>
</div>
</section>

<section class="card">
<h2>3. Attestation à relire</h2>
<div class="doc" id="doc"></div>
</section>

<section class="card">
<h2>4. Signature du client</h2>
<canvas id="pad"></canvas>
<div class="chk"><input type="checkbox" id="ok"><label for="ok" style="margin:0;color:var(--tx)">Je certifie avoir lu cette attestation et je la signe en toute connaissance de cause.</label></div>
<div class="row">
<button id="clr" type="button">Effacer la signature</button>
<button id="go" class="p" type="button" disabled>Générer le PDF signé</button>
</div>
<div id="msg"></div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const val = id => $(id).value.trim();
const blank = (s, f) => s || f;

function content() {
  const full = blank((val("pre") + " " + val("nom")).trim(), "[prénom et nom]");
  return {
    title: "Attestation de réception de service",
    p1: "GeniusPay, facilitateur de paiement, a enregistré la transaction suivante, effectuée via son marchand « " + blank(val("mar"), "[marchand]") + " » :",
    lines: [
      "Référence de la transaction : " + blank(val("ref"), "…"),
      "Numéro du client : " + blank(val("tel"), "…"),
      "E-mail du client : " + blank(val("mail"), "…"),
      "Date et heure du paiement : " + blank(val("dt"), "…")
    ],
    p2: "La fourniture du service a été confirmée de notre côté. Pour des raisons de traçabilité et afin de répondre aux demandes de vérification des passerelles de paiement, nous avons besoin d’une preuve de réception par le client.",
    decl: "Je soussigné(e) " + full + ", atteste avoir bien reçu le service correspondant au paiement ci-dessus.",
    sig: full
  };
}

function renderDoc() {
  const d = content();
  $("doc").innerHTML = "<h3>" + esc(d.title) + "</h3><p>" + esc(d.p1) + "</p>" +
    d.lines.map(l => "<p style=\"margin-left:14px\">• " + esc(l) + "</p>").join("") +
    "<p>" + esc(d.p2) + "</p><p><strong>" + esc(d.decl) + "</strong></p>";
}
document.querySelectorAll("input").forEach(e => e.addEventListener("input", () => { renderDoc(); refresh(); }));
renderDoc();

const pad = $("pad"), ctx = pad.getContext("2d");
let drawing = false, signed = false, last = null;
function sizePad() {
  const r = pad.getBoundingClientRect(), k = window.devicePixelRatio || 1;
  pad.width = Math.round(r.width * k); pad.height = Math.round(r.height * k);
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0b1b4d";
  signed = false; refresh();
}
const pos = e => { const r = pad.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
pad.addEventListener("pointerdown", e => { drawing = true; last = pos(e); pad.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + .1, last.y + .1); ctx.stroke(); signed = true; refresh(); });
pad.addEventListener("pointermove", e => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
["pointerup", "pointercancel"].forEach(t => pad.addEventListener(t, () => { drawing = false; }));
$("clr").onclick = sizePad;
window.addEventListener("resize", () => { if (!signed) sizePad(); });
$("ok").addEventListener("change", refresh);
function refresh() { $("go").disabled = !(signed && $("ok").checked && val("nom") && val("pre")); }
sizePad();

async function sha256(t) {
  try {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
  } catch (e) { return ""; }
}
function setMsg(t, ok) { const m = $("msg"); m.textContent = t; m.className = ok ? "ok" : ""; }

$("go").onclick = async () => {
  try {
    const d = content();
    const n = s => s.replace(/’/g, "'");
    const stamp = new Date();
    const stampTxt = stamp.toLocaleString("fr-FR", { dateStyle: "long", timeStyle: "short" });
    const hash = await sha256(JSON.stringify(d) + stamp.toISOString());
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: "a4" });
    const W = 210, M = 20, tw = W - 2 * M;
    let y = 28;
    doc.setFont("helvetica", "bold"); doc.setFontSize(16);
    doc.text(n(d.title).toUpperCase(), W / 2, y, { align: "center" }); y += 14;
    const para = (txt, bold, indent) => {
      doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(11);
      const lines = doc.splitTextToSize(n(txt), tw - (indent || 0));
      doc.text(lines, M + (indent || 0), y); y += lines.length * 5.6 + 3;
    };
    para(d.p1);
    d.lines.forEach(l => para("- " + l, false, 6));
    y += 2; para(d.p2); para(d.decl, true);
    y += 4;
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.text("Signature du client", M, y); y += 5;
    doc.setFont("helvetica", "italic"); doc.setFontSize(9.5); doc.text(n(d.sig), M, y); y += 4;
    const h = 70 * pad.height / pad.width;
    doc.addImage(pad.toDataURL("image/png"), "PNG", M, y, 70, h);
    y += h + 8;
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(90);
    doc.text(doc.splitTextToSize("Signé électroniquement le " + stampTxt + ". Empreinte du document : " + (hash || "indisponible") + ".", tw), M, y);
    const buf = doc.output("arraybuffer");
    const name = "attestation-" + (val("ref") || "transaction").toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-signee.pdf";
    const dl = await claude.use("downloads");
    if (!dl) { setMsg("Le téléchargement n’est pas disponible dans cette vue. Ouvrez la page dans claude.ai pour récupérer le PDF.", false); return; }
    await dl.save({ filename: name, data: buf });
    setMsg("PDF signé enregistré. Vous pouvez l’envoyer par e-mail ou WhatsApp.", true);
  } catch (e) {
    if (e && e.code === "declined") setMsg("Téléchargement annulé. Vous pouvez relancer.", false);
    else setMsg("Erreur lors de la génération du PDF. Réessayez.", false);
  }
};
</script>
</body>
</html>
